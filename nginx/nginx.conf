# ==============================================================================
# LibreChat エンタープライズ閉域網 Nginx リバースプロキシ設定
# ==============================================================================
#
# 機能:
#   - SSL/TLS終端（TLSv1.2 / TLSv1.3）
#   - WebSocket中継（LLMリアルタイムストリーミング出力対応）
#   - セキュリティヘッダー付与
#   - 大容量ファイルアップロード対応（データ分析用）
#   - LLM生成およびコード実行待機用タイムアウト延長
#
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # ログフォーマット
    # --------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # --------------------------------------------------------------------------
    # パフォーマンス設定
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # --------------------------------------------------------------------------
    # データ分析用大容量ファイル受信設定 (100MB)
    # --------------------------------------------------------------------------
    client_max_body_size 100M;

    # --------------------------------------------------------------------------
    # LLM生成およびコード実行待機用タイムアウト設定 (10分)
    # --------------------------------------------------------------------------
    proxy_connect_timeout 600s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # --------------------------------------------------------------------------
    # レートリミット定義（DDoS簡易防御）
    # --------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # --------------------------------------------------------------------------
    # セキュリティヘッダー（全レスポンスに付与）
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================================================
    # HTTP → HTTPS リダイレクト
    # ==========================================================================
    server {
        listen 80;
        server_name librechat.example.com librechat.internal.domain localhost;

        # ヘルスチェック用エンドポイント（SSL不要）
        location /nginx-health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # その他のリクエストはHTTPSへリダイレクト
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # HTTPS メインサーバー
    # ==========================================================================
    server {
        listen 443 ssl http2;
        server_name librechat.example.com librechat.internal.domain localhost;

        # ----------------------------------------------------------------------
        # SSL/TLS 証明書設定
        # 社内PKI発行またはスクリプトで生成した証明書を配置すること
        # ----------------------------------------------------------------------
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # ----------------------------------------------------------------------
        # SSL/TLS プロトコル・暗号スイート設定
        # ----------------------------------------------------------------------
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS (HTTP Strict Transport Security) - 1年間
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ----------------------------------------------------------------------
        # メインロケーション: LibreChat API & UI
        # ----------------------------------------------------------------------
        location / {
            # レートリミット適用
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://api:3080;

            # 標準プロキシヘッダー
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket ストリーミング設定 (LLMリアルタイム出力用)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # バッファリング無効化（ストリーミング応答のため）
            proxy_buffering off;

            # WebSocket接続の長時間維持
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------------------------
        # API エンドポイント（認証ヘッダーの透過）
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://api:3080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
        }
    }
}
