# ==============================================================================
# LibreChat & Code Interpreter Sandbox Hardening
# エンタープライズ閉域網 統合 Docker Compose 定義
# ==============================================================================
#
# ネットワーク構成:
#   public-frontend  : Nginx ↔ LibreChat API ↔ MongoDB（社内LAN公開層）
#   rce-backend      : LibreChat API ↔ Code API Gateway（RCE連携層）
#   rce-isolated     : Code API ↔ Redis ↔ MinIO ↔ Worker（完全隔離層）
#
# 起動方法:
#   docker compose up -d
#
# ==============================================================================

networks:
  # 社内ユーザーからアクセス可能なフロントエンドネットワーク
  public-frontend:
    driver: bridge

  # LibreChat ↔ Code API 間の内部通信ネットワーク
  rce-backend:
    driver: bridge

  # RCE実行環境の完全隔離ネットワーク（外部アクセス不可）
  rce-isolated:
    driver: bridge
    internal: true  # 外部インターネットおよびホストネットワークへのルーティングを完全遮断

# ==============================================================================
# サービス定義
# ==============================================================================
services:

  # --------------------------------------------------------------------------
  # 1. SSL/TLS リバースプロキシ (Nginx)
  # --------------------------------------------------------------------------
  # 最前段でSSL/TLS終端を担当し、社内LANからの全アクセスを中継する
  nginx:
    image: nginx:1.25-alpine
    container_name: enterprise-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - public-frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------------------------
  # 2. LibreChat API サービス
  # --------------------------------------------------------------------------
  # UI提供、ユーザー管理、LLMプロンプト制御、セッション管理
  api:
    image: ghcr.io/danny-avila/librechat-dev-api:latest
    container_name: librechat-api
    restart: unless-stopped
    environment:
      - PORT=${LIBRECHAT_PORT:-3080}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/LibreChat}
      - DOMAIN_CLIENT=${DOMAIN_CLIENT:-https://librechat.internal.domain}
      - DOMAIN_SERVER=${DOMAIN_SERVER:-https://librechat.internal.domain}
      - CONFIG_BYPASS_VALIDATION=${CONFIG_BYPASS_VALIDATION:-true}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - ALLOW_EMAIL_LOGIN=${ALLOW_EMAIL_LOGIN:-true}
      - ALLOW_UNVERIFIED_EMAIL_LOGIN=${ALLOW_UNVERIFIED_EMAIL_LOGIN:-true}
      - ALLOW_PASSWORD_RESET=${ALLOW_PASSWORD_RESET:-false}
      - ALLOW_SOCIAL_LOGIN=${ALLOW_SOCIAL_LOGIN:-false}
      - ALLOW_SOCIAL_REGISTRATION=${ALLOW_SOCIAL_REGISTRATION:-false}
      - SESSION_EXPIRY=${SESSION_EXPIRY:-86400000}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-2592000000}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CREDS_KEY=${CREDS_KEY}
      - CREDS_IV=${CREDS_IV}
      # 外部LLM API (さくらのAI / OpenAI互換)
      - EXTERNAL_API_URL=${EXTERNAL_API_URL}
      - EXTERNAL_API_KEY=${EXTERNAL_API_KEY}
      - EXTERNAL_LLM_MODEL=${EXTERNAL_LLM_MODEL}
      # Code Interpreter 連携設定
      - LIBRECHAT_CODE_BASEURL=${LIBRECHAT_CODE_BASEURL:-http://code-api:8000}
      - LIBRECHAT_CODE_API_KEY=${LIBRECHAT_CODE_API_KEY}
      - CODE_API_KEY=${LIBRECHAT_CODE_API_KEY:-Internal_Enterprise_RCE_Secret_Key_2026}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
    networks:
      - public-frontend
      - rce-backend
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # 3. データベース (MongoDB)
  # --------------------------------------------------------------------------
  # ユーザーデータ、会話履歴、設定値の永続化
  mongodb:
    image: mongo:6.0
    container_name: librechat-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - public-frontend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # --------------------------------------------------------------------------
  # 4. デファクトS3互換ストレージ (MinIO)
  # --------------------------------------------------------------------------
  # セッション分離型オブジェクトストレージ（/{session_id}/ 保存）
  # AWS S3 APIと完全互換のプライベートストレージ基盤
  minio:
    image: minio/minio:RELEASE.2024-01-31T01-37-30Z
    container_name: rce-minio
    restart: unless-stopped
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - rce-isolated
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # --------------------------------------------------------------------------
  # 4a. MinIO バケット初期化 (ワンショットジョブ)
  # --------------------------------------------------------------------------
  # 起動時にcode-interpreter用バケットを自動作成する
  minio-init:
    image: minio/mc:latest
    container_name: rce-minio-init
    entrypoint: >
      /bin/sh -c "
      echo '--- MinIO バケット初期化開始 ---';
      until mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} 2>/dev/null; do
        echo 'MinIO接続待機中...';
        sleep 2;
      done;
      mc mb myminio/$${MINIO_BUCKET} --ignore-existing;
      echo '--- MinIO バケット初期化完了: $${MINIO_BUCKET} ---';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-code-interpreter-files}
    networks:
      - rce-isolated
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # --------------------------------------------------------------------------
  # 5. タスクキュー & セッション管理 (Redis)
  # --------------------------------------------------------------------------
  # Code API ↔ Worker間のタスク配信（Pub/Sub・Queue）
  # セッションメタデータのキャッシュ
  redis:
    image: redis:7.2-alpine
    container_name: rce-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - rce-isolated
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # 6. Code Interpreter API Gateway
  # --------------------------------------------------------------------------
  # コード実行タスクの受付、APIキー認証、Redisキュー投入
  code-api:
    image: ghcr.io/clickhouse/code-interpreter-api:latest
    container_name: rce-code-api
    user: root
    restart: unless-stopped
    environment:
      - PORT=${CODE_API_PORT:-8000}
      - DISABLE_CODE_API_AUTH=true
      - DISABLE_AUTH=true
      # Redis 接続設定
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # S3 ストレージ設定（MinIO）
      - S3_ENDPOINT=${S3_ENDPOINT:-minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-code-interpreter-files}
      - S3_SECURE=${S3_SECURE:-false}
      # API認証キー
      - CODEAPI_API_KEY=${CODEAPI_API_KEY}
      - LIBRECHAT_CODE_API_KEY=${LIBRECHAT_CODE_API_KEY:-Internal_Enterprise_RCE_Secret_Key_2026}
      # サンドボックス設定
      - KVM_ENABLED=${KVM_ENABLED:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - rce-backend
      - rce-isolated
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # --------------------------------------------------------------------------
  # 7. Code Interpreter Sandboxed Worker (NsJail)
  # --------------------------------------------------------------------------
  # NsJail内でのコード実行（Ephemeral Sandbox）
  # - privileged: true → NsJailのNamespace作成に必須
  # - rce-isolated ネットワークのみ → インターネット通信完全不可
  # - リソース制限: CPU, メモリ, PID数を厳格に制限
  code-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: rce-code-worker
    working_dir: /tmp
    command: python3 /app/src/main.py
    restart: unless-stopped
    privileged: true  # NsJailのNamespace作成（PID, NET, UTS等）に必須
    environment:
      # Redis 接続設定
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # S3 ストレージ設定（MinIO）
      - S3_ENDPOINT=${S3_ENDPOINT:-minio:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-code-interpreter-files}
      - S3_SECURE=${S3_SECURE:-false}
      # サンドボックス実行制限
      - MAX_EXECUTION_TIME=${MAX_EXECUTION_TIME:-30}
      - MAX_MEMORY_MB=${MAX_MEMORY_MB:-1024}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-24}
      # サンドボックス設定
      - KVM_ENABLED=${KVM_ENABLED:-false}
      - SANDBOX_USE_CGROUPV2=${SANDBOX_USE_CGROUPV2:-true}
      - SANDBOX_MAX_PROCESS_COUNT=${SANDBOX_MAX_PROCESS_COUNT:-100}
      - SANDBOX_RUN_CPU_TIME=${SANDBOX_RUN_CPU_TIME:-10000}
      - SANDBOX_RUN_TIMEOUT=${SANDBOX_RUN_TIMEOUT:-15000}
      - SANDBOX_OUTPUT_MAX_SIZE=${SANDBOX_OUTPUT_MAX_SIZE:-65536}
      - SANDBOX_LOG_LEVEL=${SANDBOX_LOG_LEVEL:-INFO}
      # 並列処理設定
      - PYTHON_CONCURRENCY=${PYTHON_CONCURRENCY:-5}
      - OTHER_CONCURRENCY=${OTHER_CONCURRENCY:-15}
      - JOB_WINDOW=${JOB_WINDOW:-1000}
      # uv キャッシュ権限・ホーム設定
      - UV_CACHE_DIR=/tmp/.cache/uv
      - HOME=/tmp
      - UV_OFFLINE=true
      - GEMINI_API_KEY=${GEMINI_API_KEY:-dummy_gemini_api_key_for_testing}
      - OUTPUT_DIR=/tmp/data
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-2.0}"
          memory: ${WORKER_MEMORY_LIMIT:-2048M}
          pids: ${WORKER_PIDS_LIMIT:-50}
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - rce-isolated  # インターネット通信完全不可

# ==============================================================================
# ボリューム定義
# ==============================================================================
volumes:
  # MongoDB永続化ボリューム
  mongo_data:
    driver: local
  # MinIOオブジェクトストレージ永続化ボリューム
  minio_data:
    driver: local
