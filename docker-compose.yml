# ==============================================================================
# LibreChat & Code Interpreter Sandbox Hardening
# エンタープライズ閉域網 統合 Docker Compose 定義
# ==============================================================================
#
# ネットワーク構成:
#   public-frontend  : Nginx ↔ LibreChat API ↔ MongoDB（社内LAN公開層）
#   rce-backend      : LibreChat API ↔ Code API Gateway（RCE連携層）
#   rce-isolated     : Code API ↔ Redis ↔ MinIO ↔ Worker（完全隔離層）
#
# 起動方法:
#   docker compose up -d
#
# ==============================================================================

networks:
  # 社内ユーザーからアクセス可能なフロントエンドネットワーク
  public-frontend:
    driver: bridge

  # LibreChat ↔ Code API 間の内部通信ネットワーク
  rce-backend:
    driver: bridge

  # RCE実行環境の完全隔離ネットワーク（外部アクセス不可）
  rce-isolated:
    driver: bridge
    internal: true  # 外部インターネットおよびホストネットワークへのルーティングを完全遮断

# ==============================================================================
# サービス定義
# ==============================================================================
services:

  # --------------------------------------------------------------------------
  # 1. SSL/TLS リバースプロキシ (Nginx)
  # --------------------------------------------------------------------------
  # 最前段でSSL/TLS終端を担当し、社内LANからの全アクセスを中継する
  nginx:
    image: nginx:1.25-alpine
    container_name: enterprise-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - public-frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------------------------
  # 2. LibreChat API サービス
  # --------------------------------------------------------------------------
  # UI提供、ユーザー管理、LLMプロンプト制御、セッション管理
  api:
    image: ghcr.io/danny-avila/librechat-dev-api:latest
    container_name: librechat-api
    restart: unless-stopped
    environment:
      - PORT=${LIBRECHAT_PORT:-3080}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/LibreChat}
      - DOMAIN_CLIENT=${DOMAIN_CLIENT:-https://librechat.internal.domain}
      - DOMAIN_SERVER=${DOMAIN_SERVER:-https://librechat.internal.domain}
      - CONFIG_BYPASS_VALIDATION=${CONFIG_BYPASS_VALIDATION:-true}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - ALLOW_EMAIL_LOGIN=${ALLOW_EMAIL_LOGIN:-true}
      - ALLOW_UNVERIFIED_EMAIL_LOGIN=${ALLOW_UNVERIFIED_EMAIL_LOGIN:-true}
      - ALLOW_PASSWORD_RESET=${ALLOW_PASSWORD_RESET:-false}
      - ALLOW_SOCIAL_LOGIN=${ALLOW_SOCIAL_LOGIN:-false}
      - ALLOW_SOCIAL_REGISTRATION=${ALLOW_SOCIAL_REGISTRATION:-false}
      - SESSION_EXPIRY=${SESSION_EXPIRY:-86400000}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-2592000000}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CREDS_KEY=${CREDS_KEY}
      - CREDS_IV=${CREDS_IV}
      # 外部LLM API (さくらのAI / OpenAI互換)
      - EXTERNAL_API_URL=${EXTERNAL_API_URL}
      - EXTERNAL_API_KEY=${EXTERNAL_API_KEY}
      - EXTERNAL_LLM_MODEL=${EXTERNAL_LLM_MODEL}
      # Code Interpreter 連携設定
      - LIBRECHAT_CODE_BASEURL=${LIBRECHAT_CODE_BASEURL:-http://code-api:8000}
      - LIBRECHAT_CODE_API_KEY=${LIBRECHAT_CODE_API_KEY}
      - CODE_API_KEY=${LIBRECHAT_CODE_API_KEY:-Internal_Enterprise_RCE_Secret_Key_2026}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
    networks:
      - public-frontend
      - rce-backend
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # 3. データベース (MongoDB)
  # --------------------------------------------------------------------------
  # ユーザーデータ、会話履歴、設定値の永続化
  mongodb:
    image: mongo:6.0
    container_name: librechat-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - public-frontend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # --------------------------------------------------------------------------
  # 4. デファクトS3互換ストレージ (MinIO)
  # --------------------------------------------------------------------------
  # セッション分離型オブジェクトストレージ（/{session_id}/ 保存）
  # AWS S3 APIと完全互換のプライベートストレージ基盤
  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: rce-minio
    restart: unless-stopped
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - rce-isolated
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # --------------------------------------------------------------------------
  # 4a. MinIO バケット初期化 (ワンショットジョブ)
  # --------------------------------------------------------------------------
  # 起動時にcode-interpreter用バケットを自動作成する
  minio-init:
    image: minio/mc:latest
    container_name: rce-minio-init
    entrypoint: >
      /bin/sh -c "
      echo '--- MinIO バケット初期化開始 ---';
      until mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} 2>/dev/null; do
        echo 'MinIO接続待機中...';
        sleep 2;
      done;
      mc mb myminio/$${MINIO_BUCKET} --ignore-existing;
      echo '--- MinIO バケット初期化完了: $${MINIO_BUCKET} ---';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-code-interpreter-files}
    networks:
      - rce-isolated
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # --------------------------------------------------------------------------
  # 5. タスクキュー & セッション管理 (Redis)
  # --------------------------------------------------------------------------
  # Code API ↔ Worker間のタスク配信（Pub/Sub・Queue）
  # セッションメタデータのキャッシュ
  redis:
    image: redis:7.2-alpine
    container_name: rce-redis
    restart: unless-stopped
    command: redis-server --requirepass "Secure_Redis_Password_54321" --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - rce-isolated
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

# --------------------------------------------------------------------------
  # 6. Code Interpreter API Gateway (ローカルビルド)
  # --------------------------------------------------------------------------
  code-api:
    build:
      context: ./code-interpreter
      dockerfile: service/Dockerfile
      target: api
    container_name: rce-code-api
    restart: unless-stopped
    environment:
      - LOCAL_MODE=true
      - CODEAPI_HARDENED_SANDBOX_MODE=true
      - SERVICE_PORT=3112
      - SANDBOX_ENDPOINT=http://sandbox-runner:2000/api/v2
      - EGRESS_GATEWAY_URL=http://egress-gateway:3190
      - FILE_SERVER_URL=http://file-server:3000
      - TOOL_CALL_SERVER_URL=http://tool-call-server:3033
      - CODEAPI_INTERNAL_SERVICE_TOKEN=localdev-internal-service-token
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=Secure_Redis_Password_54321
      - CODEAPI_API_KEY=Internal_Enterprise_RCE_Secret_Key_2026
      - LIBRECHAT_CODE_API_KEY=Internal_Enterprise_RCE_Secret_Key_2026
    depends_on:
      redis:
        condition: service_healthy
      tool-call-server:
        condition: service_started
    networks:
      - rce-backend
      - rce-isolated
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3112/v1/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # --------------------------------------------------------------------------
  # 7. Code Interpreter Service Worker (ローカルビルド)
  # --------------------------------------------------------------------------
  service-worker:
    build:
      context: ./code-interpreter
      dockerfile: service/Dockerfile
      target: worker
    container_name: rce-service-worker
    restart: unless-stopped
    environment:
      - LOCAL_MODE=true
      - CODEAPI_HARDENED_SANDBOX_MODE=true
      - SANDBOX_ENDPOINT=http://sandbox-runner:2000/api/v2
      - EGRESS_GATEWAY_URL=http://egress-gateway:3190
      - CODEAPI_INTERNAL_SERVICE_TOKEN=localdev-internal-service-token
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=Secure_Redis_Password_54321
      - PYTHON_CONCURRENCY=2
      - OTHER_CONCURRENCY=8
      - WORKER_HEALTH_PORT=3113
      - CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY=MC4CAQAwBQYDK2VwBCIEIBoxzSJjQ5jTVyuohHtlD+uDGqv/tZ6hQS2CmxuOg2Wn
    depends_on:
      redis:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
    networks:
      - rce-isolated

  # --------------------------------------------------------------------------
  # 8. Sandbox Runner (NsJail + libkrun MicroVM サンドボックス)
  # --------------------------------------------------------------------------
  sandbox-runner:
    build:
      context: ./code-interpreter
      dockerfile: api/Dockerfile
      target: sandbox-runner-true
    container_name: rce-sandbox-runner
    restart: unless-stopped
    privileged: false
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      - KVM_ENABLED=true
      - LAUNCHER_PACKAGES_HOST=/disabled-host-packages
      - CODEAPI_HARDENED_SANDBOX_MODE=true
      - EGRESS_GATEWAY_URL=http://egress-gateway:3190
      - SANDBOX_PACKAGES_DIRECTORY=/pkgs
      - SANDBOX_LOG_LEVEL=DEBUG
      - SANDBOX_OUTPUT_MAX_SIZE=65536
      - SANDBOX_MAX_CONCURRENT_JOBS=8
      - SANDBOX_PER_JOB_UIDS=true
      - SANDBOX_JOB_UID_BASE=200000
      - SANDBOX_JOB_GID_BASE=200000
      - SANDBOX_WORKSPACE_REAPER_MAX_AGE_SECONDS=3600
      - SANDBOX_RUN_TIMEOUT=300000
      - SANDBOX_RUN_CPU_TIME=300000
      - SANDBOX_COMPILE_TIMEOUT=30000
      - LAUNCHER_VCPUS=2
      - LAUNCHER_RAM_MIB=2048
      - LAUNCHER_LOG_LEVEL=3
      - SANDBOX_ALLOWED_LOCAL_NETWORK_PORT=3190
      - SANDBOX_FORWARD_TARGET=egress-gateway:3190
      - SANDBOX_REQUIRE_EGRESS_MANIFEST=true
      - SANDBOX_EXECUTION_MANIFEST_PUBLIC_KEY=MCowBQYDK2VwAyEAeY3PRoTS3adfU6E3gQUB5hSZdrdMSw6OrKkH4UhYh0U=
    depends_on:
      egress-gateway:
        condition: service_healthy
    networks:
      - rce-isolated
    healthcheck:
      test: ["CMD", "/usr/local/bin/sandbox-runner-healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  # --------------------------------------------------------------------------
  # 9. Egress Gateway (外部通信制御ゲートウェイ)
  # --------------------------------------------------------------------------
  egress-gateway:
    build:
      context: ./code-interpreter
      dockerfile: service/Dockerfile.egress-gateway
      target: production
    container_name: rce-egress-gateway
    restart: unless-stopped
    environment:
      - SERVICE_NAME=egress-gateway
      - CODEAPI_HARDENED_SANDBOX_MODE=true
      - EGRESS_GATEWAY_PORT=3190
      - EGRESS_GATEWAY_FILE_SERVER_URL=http://file-server:3000
      - EGRESS_GATEWAY_TOOL_CALL_SERVER_URL=http://tool-call-server:3033
      - CODEAPI_EGRESS_GRANT_SECRET=localdev-egress-grant-secret-change-me-32b
      - CODEAPI_INTERNAL_SERVICE_TOKEN=localdev-internal-service-token
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=Secure_Redis_Password_54321
    depends_on:
      - file-server
      - tool-call-server
      - redis
    networks:
      - rce-isolated

  # --------------------------------------------------------------------------
  # 10. File Server (MinIO S3 連携ファイルサーバー)
  # --------------------------------------------------------------------------
  file-server:
    build:
      context: ./code-interpreter
      dockerfile: service/Dockerfile
      target: production
    container_name: rce-file-server
    restart: unless-stopped
    environment:
      - MINIO_BUCKET=code-interpreter-files
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=enterprise_rce_admin
      - MINIO_SECRET_KEY=Secure_Encrypted_Minio_Password_98765
      - FILE_SERVER_PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=Secure_Redis_Password_54321
      - CODEAPI_INTERNAL_SERVICE_TOKEN=localdev-internal-service-token
    depends_on:
      - minio
      - redis
    networks:
      - rce-isolated

  # --------------------------------------------------------------------------
  # 11. Tool Call Server (プログラムツール呼び出しサーバー)
  # --------------------------------------------------------------------------
  tool-call-server:
    build:
      context: ./code-interpreter
      dockerfile: service/Dockerfile.tool-call-server
      target: production
    container_name: rce-tool-call-server
    restart: unless-stopped
    environment:
      - TOOL_CALL_SERVER_PORT=3033
      - TOOL_CALL_REQUEST_TIMEOUT=300000
      - TOOL_CALL_SESSION_EXPIRY=600
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=Secure_Redis_Password_54321
      - CODEAPI_INTERNAL_SERVICE_TOKEN=localdev-internal-service-token
    depends_on:
      - redis
    networks:
      - rce-isolated
# ==============================================================================
# ボリューム定義
# ==============================================================================
volumes:
  # MongoDB永続化ボリューム
  mongo_data:
    driver: local
  # MinIOオブジェクトストレージ永続化ボリューム
  minio_data:
    driver: local
