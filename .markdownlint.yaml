# MarkdownLint 設定
# ドキュメント記述の柔軟性を保ちつつ、致命的なMarkdown構文崩れのみを検知する実用的設定
default: true
MD013: false # 行長制限の無効化
MD022: false # 見出し前後の空行制限の緩和
MD024: false # 同名見出しの重複制限の緩和
MD025: false # タイトルH1制限の緩和
MD031: false # コードブロック前後の空行制限の緩和
MD032: false # リスト前後の空行制限の緩和
MD033: false # インラインHTMLの許容
MD036: false # 太字による強調を擬似見出しとして許容
MD040: false # コードブロック言語指定の強制緩和
MD041: false # 先頭H1強制の緩和
MD060: false # テーブルのパイプ余白スタイルの緩和
